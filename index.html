<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Telegram Mini App</title>
    <!-- 1. ПОДКЛЮЧАЕМ СКРИПТ TELEGRAM -->
    <script src="js/telegram-web-app.js"></script>
    <style>
        /* 2. НАСТРАИВАЕМ ЦВЕТА ПОД ТЕМУ TELEGRAM */
        body {
            font-family: Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .user-card {
            background-color: var(--tg-theme-secondary-bg-color, #f0f0f0);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
        }
        button {
            background-color: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>Профиль пользователя Telegram</h1>
    
    <!-- Контейнер для красивого вывода всех полей -->
    <div class="user-card" id="userDataContainer">
        <p>Загрузка данных профиля...</p>
    </div>

    <button id="sendBtn">Отправить данные боту</button>

<script>
    // Универсальная функция для вывода отладочных сообщений прямо на экран
    function logToScreen(message, isError = false) {
        const container = document.getElementById('userDataContainer');
        if (container) {
            if (container.innerText.includes("Загрузка данных профиля")) {
                container.innerHTML = ""; // Очищаем стартовую заглушку
            }
            const color = isError ? "red" : "var(--tg-theme-text-color, #000000)";
            container.innerHTML += `<p style="color: ${color}; text-align: left; margin: 4px 0;">${message}</p>`;
        }
        console.log(message);
    }

    function loadTelegramScript() {
        return new Promise((resolve, reject) => {
            const script = document.createElement('script');
            // 1. Сначала пробуем официальный скрипт
            script.src = "https://telegram.org";
            script.onload = () => {
                logToScreen("✓ Официальный скрипт Telegram загружен");
                resolve();
            };
            script.onerror = () => {
                logToScreen("⚠ Ошибка загрузки с telegram.org. Пробуем локальный скрипт...", true);
                reject();
            };
            document.head.appendChild(script);
        });
    }

    // Запускаем процесс
    loadTelegramScript()
        .then(() => { initMiniApp(); })
        .catch(() => {
            // Резервный вариант: загрузка локального файла
            const localScript = document.createElement('script');
            localScript.src = "js/telegram-web-app.js"; 
            localScript.onload = () => {
                logToScreen("✓ Локальный скрипт загружен успешно");
                initMiniApp();
            };
            localScript.onerror = () => {
                logToScreen("❌ КРИТИЧЕСКАЯ ОШИБКА: Не удалось загрузить ни один скрипт!", true);
            };
            document.head.appendChild(localScript);
        });

    function initMiniApp() {
        try {
            // Проверяем, существует ли глобальный объект Telegram
            if (!window.Telegram || !window.Telegram.WebApp) {
                logToScreen("❌ Ошибка: window.Telegram.WebApp не найден в системе!", true);
                return;
            }

            const tg = window.Telegram.WebApp;
            
            // Важно: вызываем ready() сразу
            tg.ready();
            logToScreen("✓ Telegram WebApp инициализирован. Версия API: " + tg.version);

            // Проверяем initData и user
            if (!tg.initDataUnsafe) {
                logToScreen("⚠ Предупреждение: initDataUnsafe пуст", true);
            }

            if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
                const user = tg.initDataUnsafe.user;
                logToScreen("<h3>Данные профиля:</h3>");
                
                const fieldLabels = {
                    id: "🆔 Telegram ID",
                    first_name: "👤 Имя",
                    last_name: "👥 Фамилия",
                    username: "🏷️ Юзернейм (@)",
                    language_code: "🌐 Язык интерфейса",
                    is_premium: "⭐ Premium",
                    allows_write_to_pm: "💬 Доступ в ЛС"
                };

                for (const key in user) {
                    if (user.hasOwnProperty(key)) {
                        let value = user[key];
                        if (typeof value === 'boolean') value = value ? "Да" : "Нет";
                        if (!value) value = "Не указано";
                        
                        const label = fieldLabels[key] || key;
                        logToScreen(`<strong>${label}:</strong> ${value}`);
                    }
                }
            } else {
                logToScreen("⚠ Данные пользователя отсутствуют. Возможно, вы зашли с ПК браузера, а не из приложения Telegram.");
            }

            // Настройка кнопки
            const sendBtn = document.getElementById('sendBtn');
            if (sendBtn) {
                sendBtn.onclick = function() {
                    if (window.Telegram && window.Telegram.WebApp && tg.initDataUnsafe && tg.initDataUnsafe.user) {
                        tg.sendData(JSON.stringify(tg.initDataUnsafe.user));
                    } else {
                        alert("Ошибка: Нечего отправлять");
                    }
                    tg.close();
                };
            }

        } catch (error) {
            logToScreen("❌ Исключение в коде: " + error.message, true);
        }
    }
</script>
</body>

</html>
