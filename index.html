<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Mini App</title>
    
    <script src="./js/telegram-web-app.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .user-card {
            background-color: var(--tg-theme-secondary-bg-color, #f0f0f0);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
        }
        button {
            background-color: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>Профиль пользователя Telegram</h1>
    
    <div class="user-card" id="userDataContainer">
        <p>Инициализация приложения...</p>
    </div>

    <button id="sendBtn">Отправить данные боту</button>

    <script>
        // Код выполнится сразу, как только страница загрузится
        window.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('userDataContainer');

            // 1. Проверяем, на месте ли библиотека Telegram
            if (!window.Telegram || !window.Telegram.WebApp) {
                container.innerHTML = "<p style='color:red;'>❌ Ошибка: Библиотека Telegram не найдена по адресу ./js/telegram-web-app.js</p>";
                return;
            }

            const tg = window.Telegram.WebApp;
            tg.ready(); // Сообщаем Telegram, что мы открылись

            // 2. Выводим данные, если зашли из бота
            if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
                const user = tg.initDataUnsafe.user;
                container.innerHTML = "<h3>Ваш аккаунт:</h3>";

                const fieldLabels = {
                    id: "🆔 Telegram ID",
                    first_name: "👤 Имя",
                    last_name: "👥 Фамилия",
                    username: "🏷️ Юзернейм (@)",
                    language_code: "🌐 Язык",
                    is_premium: "⭐ Premium"
                };

                for (const key in user) {
                    if (user.hasOwnProperty(key)) {
                        let value = user[key];
                        if (typeof value === 'boolean') value = value ? "Да" : "Нет";
                        if (!value) value = "Не указано";
                        
                        const label = fieldLabels[key] || key;
                        container.innerHTML += `<p style="text-align: left; margin: 8px 0;"><strong>${label}:</strong> ${value}</p>`;
                    }
                }
            } else {
                // Если открыли в обычном браузере на ПК
                container.innerHTML = `<p style="color: orange;">✓ Скрипт успешно работает!<br><br>Данные пользователя пустые, потому что вы открыли сайт вне Telegram.<br><b>Запустите Mini App через кнопку в боте.</b></p>`;
            }

            // Кнопка отправки данных боту
            const sendBtn = document.getElementById('sendBtn');
            if (sendBtn) {
                sendBtn.onclick = function() {
                    if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
                        tg.sendData(JSON.stringify(tg.initDataUnsafe.user));
                    }
                    tg.close();
                };
            }
        });
    </script>
</body>
</html>
