<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Telegram Mini App</title>
    <!-- 1. ПОДКЛЮЧАЕМ СКРИПТ TELEGRAM -->
    <script src="js/telegram-web-app.js"></script>
    <style>
        /* 2. НАСТРАИВАЕМ ЦВЕТА ПОД ТЕМУ TELEGRAM */
        body {
            font-family: Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .user-card {
            background-color: var(--tg-theme-secondary-bg-color, #f0f0f0);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
        }
        button {
            background-color: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>Профиль пользователя Telegram</h1>
    
    <!-- Контейнер для красивого вывода всех полей -->
    <div class="user-card" id="userDataContainer">
        <p>Загрузка данных профиля...</p>
    </div>

    <button id="sendBtn">Отправить данные боту</button>

    <script>
        // ... (код загрузки скрипта, который мы писали ранее, остается без изменений) ...

        function initMiniApp() {
            const tg = window.Telegram.WebApp;
            tg.ready();

            const container = document.getElementById('userDataContainer');

            // 1. ПРОВЕРЯЕМ НАЛИЧИЕ ДАННЫХ ПОЛЬЗОВАТЕЛЯ
            if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
                const user = tg.initDataUnsafe.user;
                
                // Очищаем текст загрузки
                container.innerHTML = "<h3>Ваш аккаунт:</h3>";

                // Словарь для красивых названий полей на русском языке
                const fieldLabels = {
                    id: "🆔 Telegram ID",
                    first_name: "👤 Имя",
                    last_name: "👥 Фамилия",
                    username: "🏷️ Юзернейм (@)",
                    language_code: "🌐 Язык интерфейса",
                    is_premium: "⭐ Telegram Premium",
                    allows_write_to_pm: "💬 Разрешено писать в ЛС"
                };

                // Перебираем все свойства, которые вернул Telegram
                for (const key in user) {
                    if (user.hasOwnProperty(key)) {
                        let value = user[key];

                        // Форматируем логические значения (true/false) в понятный вид
                        if (typeof value === 'boolean') {
                            value = value ? "Да" : "Нет";
                        }
                        // Если значения нет, пишем "Не указано"
                        if (value === undefined || value === null || value === "") {
                            value = "Не указано";
                        }

                        // Получаем красивую метку или оставляем техническое имя поля
                        const label = fieldLabels[key] || key;

                        // Добавляем строчку с данными на страницу
                        container.innerHTML += `<p style="text-align: left; margin: 8px 0;"><strong>${label}:</strong> ${value}</p>`;
                    }
                }
            } else {
                // Если открыли просто в обычном браузере вне Telegram
                container.innerHTML = "<p>⚠️ Приложение запущено вне Telegram. Данные профиля недоступны.</p>";
            }

            // Логика кнопки отправки (передаем боту ВСЕ данные пользователя для теста)
            const sendBtn = document.getElementById('sendBtn');
            if (sendBtn) {
                sendBtn.onclick = function() {
                    if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
                        // Отправляем весь объект user обратно боту в виде JSON-строки
                        tg.sendData(JSON.stringify(tg.initDataUnsafe.user));
                    } else {
                        alert("Нечего отправлять: вы открыли сайт вне Telegram");
                    }
                    tg.close();
                };
            }
        }
    </script>
</body>

</html>
